<aside class="sidebar">
  <div class="logo-container">
    <div class="logo-wrapper">
      <img src="/images/logo.png" alt="Logo" class="sidebar-logo">
    </div>
    <div class="logo-text">
      <span class="brand">Raymund</span>
      <span class="sub">Coffee</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a *ngFor="let item of menuItems()" 
       [routerLink]="item.route" 
       routerLinkActive="active" 
       class="nav-item">
      <span class="material-icons-round">{{item.icon}}</span>
      <span class="item-label">{{item.label}}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">{{ user()?.name?.substring(0,2) || 'AD' }}</div>
      <div class="user-details">
        <p class="user-name">{{ user()?.name || 'Admin User' }}</p>
        <p class="user-role">Super Admin</p>
      </div>
      <button class="logout-btn" (click)="logout()" [title]="t().MENU_LOGOUT">
        <span class="material-icons-round">logout</span>
      </button>
    </div>
  </div>
</aside>
