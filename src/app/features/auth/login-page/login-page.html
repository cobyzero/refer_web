<div class="auth-wrapper">
  <div class="background-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-card">
    <div class="card-header">
      <div class="logo">R</div>
      <h1>Bienvenido de nuevo</h1>
      <p>Ingresa tus credenciales para acceder al panel de ReferAdmin</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        <span class="material-icons-round">error_outline</span>
        {{errorMessage}}
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <span class="material-icons-round">mail_outline</span>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="admin@refer.com"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="material-icons-round">lock_outline</span>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="remember">
          <span class="checkmark"></span>
          Recordarme
        </label>
        <a href="#" class="forgot-pwd">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>

    <div class="card-footer">
      <p>¿No tienes una cuenta? <a href="#">Contacta al administrador</a></p>
    </div>
  </div>
</div>
