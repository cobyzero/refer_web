<div class="auth-page">
  <div class="bg-container">
    <img src="/images/cafe_bg.png" alt="Fondo" class="bg-image">
    <div class="bg-overlay"></div>
  </div>

  <div class="quote-container">
    <p class="quote-text">Preparando la infusión perfecta, un grano a la vez.</p>
    <div class="quote-divider"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <div class="logo-wrapper">
          <img src="/images/logo.png" alt="Logotipo" class="logo">
        </div>
        <h1 class="brand-name">Raymund Coffee</h1>
        <p class="portal-subtitle">PORTAL DE ADMINISTRACIÓN</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div *ngIf="errorMessage" class="error-message">
          {{errorMessage}}
        </div>

        <div class="form-field">
          <label for="email">CORREO ELECTRÓNICO</label>
          <div class="input-wrapper">
            <span class="input-icon material-icons-round">mail_outline</span>
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="admin@botanicalatelier.com"
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-field">
          <label for="password">CONTRASEÑA</label>
          <div class="password-input-wrapper">
            <div class="input-wrapper">
              <span class="input-icon material-icons-round">lock_outline</span>
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="password" 
                formControlName="password" 
                placeholder="••••••••"
                autocomplete="current-password"
              >
            </div>
            <button type="button" class="toggle-password" (click)="togglePassword()">
              <span class="material-icons-round">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" formControlName="remember">
            <span class="custom-checkbox"></span>
            Recordarme
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="signin-btn" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading" class="btn-content">
            Iniciar Sesión <span class="arrow">→</span>
          </span>
          <span *ngIf="isLoading" class="loader"></span>
        </button>
      </form>

      <div class="card-footer">
        <p>Solo Personal Autorizado</p>
        <p>Contacta a Soporte Técnico para problemas de acceso</p>
        <div class="credentials-hint">
          <span class="label">Demo:</span>
          <span class="value">TheAdmin / Admin$123</span>
        </div>
      </div>
    </div>
  </div>
</div>
